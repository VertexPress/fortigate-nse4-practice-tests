# FortiGate NSE 4 Practice Tests, companion repository
# Exam 4, Question 1. HA heartbeat device priority.
# The paired numbers after each heartbeat interface are heartbeat priorities;
# the higher value is preferred to carry heartbeat (here port4 at 100 over port3 at 50).
# FortiOS 7.6. Runs as printed.
config system ha
    set mode a-p
    set hbdev "port3" 50 "port4" 100
end
