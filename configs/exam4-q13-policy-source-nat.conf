# FortiGate NSE 4 Practice Tests, companion repository
# Exam 4, Question 13. Firewall policy with NAT enabled and no IP pool.
# With nat enable and no pool, source NAT uses the outgoing interface (port1) address.
# FortiOS 7.6. Runs as printed (requires the referenced interfaces to exist).
config firewall policy
    edit 7
        set srcintf "port3"
        set dstintf "port1"
        set action accept
        set nat enable
    next
end
