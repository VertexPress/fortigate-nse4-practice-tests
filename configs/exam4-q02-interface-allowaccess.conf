# FortiGate NSE 4 Practice Tests, companion repository
# Exam 4, Question 2. Interface administrative access.
# allowaccess here permits ping and ssh only; https is absent, so the GUI is unreachable.
# Add https (and http if wanted) to open the GUI.
# FortiOS 7.6. Runs as printed.
config system interface
    edit "port1"
        set allowaccess ping ssh
    next
end
