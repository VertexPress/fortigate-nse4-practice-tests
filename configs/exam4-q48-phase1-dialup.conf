# FortiGate NSE 4 Practice Tests, companion repository
# Exam 4, Question 48. Dial-up IPsec Phase 1.
# type dynamic makes this an accept-connections (dial-up) tunnel; peertype any lets
# peers with changing addresses connect; psksecret sets pre-shared-key authentication.
# Replace the masked psksecret with a real pre-shared key before use.
# FortiOS 7.6. Runs as printed once a valid psksecret is supplied.
config vpn ipsec phase1-interface
    edit "dialup"
        set type dynamic
        set peertype any
        set psksecret ENTER_A_STRONG_PRE_SHARED_KEY
    next
end
