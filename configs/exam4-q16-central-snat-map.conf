# FortiGate NSE 4 Practice Tests, companion repository
# Exam 4, Question 16. Central SNAT map entry.
# Source-NATs traffic from internal-net egressing port1 to the addresses in pool-a.
# FortiOS 7.6. Runs as printed (requires internal-net and pool-a to exist, central NAT enabled).
config firewall central-snat-map
    edit 1
        set orig-addr "internal-net"
        set srcintf "port3"
        set dstintf "port1"
        set nat-ippool "pool-a"
    next
end
